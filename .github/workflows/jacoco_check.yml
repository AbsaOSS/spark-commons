name: JaCoCo report

on:
  pull_request:
    branches: [ master ]
    types: [ opened, edited, synchronize, reopened ]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: jacoco-report-${{ github.ref }}
  cancel-in-progress: true

env:
  # hint: "group thresholds" are in format: 'overall*changed-files-average*per-changed-file'
  # one report group per Spark version
  REPORT_GROUPS: |
    - name: scala2.11-spark2.4
      paths:
        - '**/target/spark-commons2.4*-jvm-2_11*/jacoco-report/jacoco.xml'
      thresholds: '75*80*60'
    - name: scala2.12-spark3.3
      paths:
        - '**/target/spark-commons3.3*-jvm-2_12*/jacoco-report/jacoco.xml'
      thresholds: '73*80*60'

jobs:
  detect:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      scala_changed: ${{ steps.filter.outputs.scala }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        id: filter
        with:
          token: ""
          filters: |
            scala:
              - '**/*.scala'
              - '!project/**'

  jacoco-report:
    name: JaCoCo Report
    needs: detect
    if: needs.detect.outputs.scala_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      # Spark 2.4 only supports Java 8, so the whole matrix is built on Java 8.
      - name: Setup Scala
        uses: olafurpg/setup-scala@32ffa16635ff8f19cc21ea253a987f0fdf29844c
        with:
          java-version: "adopt@1.8"

      - name: Build and run tests with coverage
        continue-on-error: true
        run: sbt jacoco

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Add JaCoCo Report in PR comments
        uses: MoranaApps/jacoco-report@562ba603c5b95021dbee26e89ae0f834f2dd8b9e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          global-thresholds: '71*80'
          global-overall-scope: 'groups-only'
          report-thresholds-default: '33*80*60'
          skip-unchanged: 'true'
          evaluate-unchanged: 'false'
          report-groups: ${{ env.REPORT_GROUPS }}

  noop:
    name: No Operation
    needs: detect
    if: needs.detect.outputs.scala_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No changes in Scala related files — passing."
